name: Deploy site

on:
  push:
    branches: [main]
    paths-ignore:
      - "scripts/**"
      - "firebase/**"
      - "README.md"
  workflow_dispatch:
  # Called by the signature workflow after it commits new data. A push made with GITHUB_TOKEN
  # does not trigger other workflows, so without this the public numbers would never refresh.
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp -r index.html embed.js CNAME assets builder campaigns data _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
