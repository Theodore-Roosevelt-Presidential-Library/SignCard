name: Process signatures

# Every 10 minutes: read new signatures from Firestore, screen them with OpenAI, update the
# private running totals in Firestore and the public numbers in data/<campaign>.json, then
# redeploy the site if anything changed.
#
# Google sign-in uses Workload Identity Federation: GitHub proves to Google that this run comes
# from this repository, and Google lets it act as the signcard-actions service account. No key
# file exists anywhere (trlibrary.com blocks service account keys). Setup: firebase/setup-wif.sh.
# One repository secret is needed: OPENAI_KEY (same name as the Reviews repo).

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "campaigns/**"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: process-signatures
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    # Landscape campaigns stay on for SIGNCARD_LIVE_MINUTES during their live hours (see scripts/process_signatures.py).
    timeout-minutes: 25
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      # Check out the latest main, not the commit this run was queued on. Runs are serialized,
      # so by the time a queued run starts the previous one has usually pushed newer data/.
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt
      - name: Sign in to Google Cloud (no key file)
        id: gcp
        continue-on-error: true
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/762009281473/locations/global/workloadIdentityPools/github/providers/signcard
          service_account: signcard-actions@trpl-signcard.iam.gserviceaccount.com
      - name: Process new signatures
        env:
          GOOGLE_SIGNIN: ${{ steps.gcp.outcome }}
          OPENAI_KEY: ${{ secrets.OPENAI_KEY }}
        run: python3 scripts/process_signatures.py
      - name: Commit public numbers
        id: commit
        run: |
          git config user.name  "trpl-signcard-bot"
          git config user.email "actions@github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Update card data"
            # On a rejected push, rebase onto the newer main and retry. -X theirs keeps this
            # run's data/ files, which are built from the latest Firestore totals.
            pushed=false
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then
                pushed=true
                break
              fi
              if [ "$attempt" -lt 3 ]; then
                echo "Push rejected (attempt $attempt of 3); rebasing onto origin/main"
                git pull --rebase -X theirs origin main
              fi
            done
            if [ "$pushed" != "true" ]; then
              echo "::error::Could not push card data after 3 attempts"
              exit 1
            fi
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: process
    if: needs.process.outputs.changed == 'true'
    uses: ./.github/workflows/pages.yml
